<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masaüstü Dijital Saat</title>
    <link rel="icon" href="../profil.png" type="image/png">
    <link rel="shortcut icon" href="../profil.png" type="image/png">
<style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #e0e5ec;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .clock-card {
            background-color: #ffffff;
            padding: 5%;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1), 0 1px 8px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 90%;
            max-width: 750px;
            box-sizing: border-box;
        }

        .time-container {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            gap: 1%;
        }

        .digit {
            width: 12%;
            max-width: 80px;
            height: auto;
            object-fit: contain;
        }

        .colon {
            font-size: clamp(30px, 6vw, 80px);
            font-weight: 700;
            color: #333333;
            margin: 0 1%;
            line-height: 1;
            padding-bottom: clamp(5px, 2vw, 15px);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        .date-display {
            font-size: clamp(16px, 4vw, 28px);
            font-weight: 500;
            color: #5f6368;
            text-transform: capitalize;
            text-align: center;
        }

        .top-left-button {
            position: fixed;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            background-color: rgb(50, 50, 50);
            color: rgb(205,208,213);
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        
        .top-left-button:hover {
            background-color: rgb(5,50,50);
            transform: scale(1.15);
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #121212;
            }

            .clock-card {
                background-color: #1e1e1e;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 1px 8px rgba(0, 0, 0, 0.3);
            }

            .colon {
                color: #e0e0e0;
            }

            .date-display {
                color: #a0a0a0;
            }
        }
    </style>
</head>
<body>
    <a href="../"><button class="top-left-button">Ana Sayfa</button></a>
    
    <div class="clock-card">
        <div class="time-container">
            <img class="digit" id="hour-tens" src="" alt="0">
            <img class="digit" id="hour-ones" src="" alt="0">
            
            <div class="colon">:</div>
            
            <img class="digit" id="min-tens" src="" alt="0">
            <img class="digit" id="min-ones" src="" alt="0">
            
            <div class="colon">:</div>
            
            <img class="digit" id="sec-tens" src="" alt="0">
            <img class="digit" id="sec-ones" src="" alt="0">
        </div>

        <div class="date-display" id="date-display"></div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();

            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hour-tens').src = hours[0] + '.gif';
            document.getElementById('hour-ones').src = hours[1] + '.gif';
            
            document.getElementById('min-tens').src = minutes[0] + '.gif';
            document.getElementById('min-ones').src = minutes[1] + '.gif';
            
            document.getElementById('sec-tens').src = seconds[0] + '.gif';
            document.getElementById('sec-ones').src = seconds[1] + '.gif';

            const aylar = [
                "Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", 
                "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"
            ];
            const gunler = [
                "Pazar", "Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi"
            ];

            const dayNum = now.getDate();
            const monthStr = aylar[now.getMonth()];
            const dayStr = gunler[now.getDay()];

            const dateString = `${dayNum} ${monthStr} ${dayStr}`;
            document.getElementById('date-display').innerText = dateString;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
